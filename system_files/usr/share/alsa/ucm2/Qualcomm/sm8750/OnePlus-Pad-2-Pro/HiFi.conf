# SPDX-License-Identifier: BSD-3-Clause
# Route both frontends before PipeWire probes their PCMs. Device enable
# runs only after probing, which is too late for AudioReach PCM open.
SectionVerb {
	EnableSequence [
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 1,1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 0,0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]
	Value {
		TQ "HiFi"
	}
}

# Analog microphone routes and gains are derived from erhai-audio.
# Apply optional 75 Hz high-pass controls only on kernels exposing them.
# Capture gain and frequency response need separate Armada calibration.
SectionDevice."Mic" {
	Comment "Internal microphones"
	EnableSequence [
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC4 MUX' CH4_AMIC5"
		cset "name='TX0 MODE' ADC_HIFI"
		cset "name='TX3 MODE' ADC_HIFI"
		cset "name='ADC1 Volume' 13"
		cset "name='ADC4 Volume' 13"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX SMIC MUX1' SWR_MIC3"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='DEC1 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 112"
		cset "name='TX_DEC1 Volume' 112"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
	]
	If.hpf0 {
		Condition {
			Type ControlExists
			Control "name='TX0 HPF cut off'"
		}
		True.EnableSequence [
			cset "name='TX0 HPF cut off' CF_NEG_3DB_75HZ"
		]
	}
	If.hpf1 {
		Condition {
			Type ControlExists
			Control "name='TX1 HPF cut off'"
		}
		True.EnableSequence [
			cset "name='TX1 HPF cut off' CF_NEG_3DB_75HZ"
		]
	}
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}

# Keep microphone discovery independent of DisplayPort playback. The sound
# server probes every PCM in a verb and drops the entire profile if one fails.
# DisplayPort is excluded until unplugged probing and hotplug pass.

# Internal speakers use the reference project's amplifier levels; see
# Speaker.conf. They must be discoverable on every boot.
Include.speaker.File "/Qualcomm/sm8750/OnePlus-Pad-2-Pro/Speaker.conf"
