# SPDX-License-Identifier: BSD-3-Clause
# Derived from erhai-audio, with conservative gain for the unprotected path.
# Stereo S16_LE / 48 kHz is expanded by the DSP to eight TDM slots.
# Six amplifiers use slots 0,1,2,3,5,6. Keep DSP volume at Q13 unity (8192)
# and amplifier gain at -22.5 dB (270); desktop volume attenuates in software.
# Vendor speaker protection is not present, so do not use vendor gain 350.

SectionDevice."Speaker" {
	Comment "Speakers"
	EnableSequence [
		cset "name='Amp0 PCM Playback Volume' 270"
		cset "name='Amp1 PCM Playback Volume' 270"
		cset "name='Amp2 PCM Playback Volume' 270"
		cset "name='Amp3 PCM Playback Volume' 270"
		cset "name='Amp5 PCM Playback Volume' 270"
		cset "name='Amp6 PCM Playback Volume' 270"
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
