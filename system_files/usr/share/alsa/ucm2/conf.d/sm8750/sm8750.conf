Syntax 4

# ASoC may derive CardLongName from firmware DMI. Match the DT card name
# instead; the driver fallback is shared with other SM8750 machines.
If.oneplus {
	Condition {
		Type String
		String1 "${CardName}"
		String2 "OnePlus-Pad-2-Pro"
	}
	True.Include.oneplus.File "/conf.d/sm8750/OnePlus-Pad-2-Pro.conf"
}
